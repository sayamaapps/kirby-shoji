name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl
          coverage: none

      - name: Install dev dependencies (Kirby as fixture)
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-gd

      - name: Tests
        run: sh tests/run.sh

  script:
    name: shoji.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Behaviour (fake DOM, no dependencies)
        run: node --test tests/*.test.mjs

      - name: Syntax check, no storage, no cookies, no foreign host
        run: |
          node --check assets/shoji.js
          if grep -nE 'localStorage|sessionStorage|document\.cookie|indexedDB' assets/shoji.js; then
            echo "::error::shoji.js must not store anything in the browser"; exit 1
          fi
          if grep -nPi 'https?://(?!github\.com/simsimmal)' assets/shoji.js; then
            echo "::error::shoji.js must not name any address except the project page"; exit 1
          fi
